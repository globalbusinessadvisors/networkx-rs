[package]
name = "networkx-rs"
version = "0.1.0"
edition = "2021"
authors = ["NetworkX-RS Contributors"]
license = "MIT"
description = "Rust-accelerated NetworkX graph algorithms"
repository = "https://github.com/networkx/networkx-rs"
keywords = ["graph", "network", "algorithm", "networkx", "performance"]
categories = ["algorithms", "data-structures", "science"]

[lib]
name = "networkx_rs_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core dependencies
rayon = { version = "1.10", optional = true }
ahash = "0.8"
indexmap = "2.2"
petgraph = { version = "0.6", optional = true }
num-traits = "0.2"
priority-queue = "2.0"
rustc-hash = "2.0"
rand = "0.8"
rand_chacha = "0.3"

# GPU Support (optional)
arrayfire = { version = "3.8", optional = true }
cuda-sys = { version = "0.2", optional = true }
cust = { version = "0.3", optional = true }
ndarray = { version = "0.15", optional = true }
sprs = { version = "0.11", optional = true }

# Distributed Computing (optional)
tonic = { version = "0.11", optional = true }
prost = { version = "0.12", optional = true }
tokio = { version = "1.35", features = ["full"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"], optional = true }
numpy = { version = "0.22", optional = true }

# Serialization (already defined above)
serde_json = { version = "1.0", optional = true }

# Performance
# packed_simd_2 removed due to requiring nightly Rust
blas-src = { version = "0.10", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"
approx = "0.5"

[features]
default = ["pyo3", "numpy", "parallel"]
pyo3 = ["dep:pyo3"]
parallel = ["rayon"]
# GPU features
gpu = ["arrayfire", "ndarray", "sprs"]
cuda = ["cuda-sys", "cust"]
# Distributed features
distributed = ["tonic", "prost", "tokio", "serde", "bincode"]
# Other features
serialize = ["serde", "serde_json"]
petgraph-compat = ["petgraph"]
numpy-compat = ["numpy"]
blas = ["blas-src"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"

[[bench]]
name = "dijkstra"
harness = false

[[bench]]
name = "comprehensive"
harness = false

[[bench]]
name = "phase4_gpu_distributed"
harness = false

[package.metadata.maturin]
python-source = "python"
module-name = "networkx_rs.networkx_rs"